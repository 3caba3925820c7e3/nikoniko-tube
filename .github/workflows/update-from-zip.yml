name: Update app from ZIP

on:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 1. ZIPを探す
      # ------------------------------------------------------------
      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            -not -path "./.github/*" \
            -print \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file was not found."
            exit 1
          fi

          ZIP_FILE="${ZIP_FILE#./}"

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 2. /tmpへ安全に展開
      # ------------------------------------------------------------
      - name: Extract ZIP safely
        id: extract
        env:
          ZIP_FILE: ${{ steps.zip.outputs.zip_file }}
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="/tmp/yt_music_zip_extract"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          echo "Extract directory:"
          echo "$EXTRACT_DIR"

          python3 - "$ZIP_FILE" "$EXTRACT_DIR" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          zip_path = Path(sys.argv[1]).resolve()
          destination = Path(sys.argv[2]).resolve()

          print("ZIP:", zip_path)
          print("Destination:", destination)

          if not zip_path.is_file():
              raise RuntimeError(f"ZIP file does not exist: {zip_path}")

          with zipfile.ZipFile(zip_path, "r") as z:
              members = z.infolist()

              if not members:
                  raise RuntimeError("ZIP file is empty.")

              print("")
              print("ZIP contents:")

              for member in members:
                  name = member.filename

                  print(" -", name)

                  # Absolute path protection
                  member_path = Path(name)

                  if member_path.is_absolute():
                      raise RuntimeError(
                          f"Unsafe absolute path in ZIP: {name}"
                      )

                  # Zip Slip protection
                  target = (destination / member_path).resolve()

                  try:
                      target.relative_to(destination)
                  except ValueError:
                      raise RuntimeError(
                          f"Unsafe path in ZIP: {name}"
                      )

              z.extractall(destination)

          print("")
          print("ZIP extraction completed successfully.")
          PY

          echo "extract_dir=$EXTRACT_DIR" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 3. 展開結果を確認
      # ------------------------------------------------------------
      - name: Verify extracted application
        id: root
        env:
          EXTRACT_DIR: ${{ steps.extract.outputs.extract_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Extracted files"
          echo "========================================"

          find "$EXTRACT_DIR" \
            -maxdepth 6 \
            -print \
            | sort

          echo ""

          FILE_COUNT="$(find "$EXTRACT_DIR" -type f | wc -l)"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: ZIP contains no files."
            exit 1
          fi

          echo "Files extracted: $FILE_COUNT"

          # --------------------------------------------------------
          # ZIPの構造を判定
          #
          # パターンA:
          #   main.py
          #   requirements.txt
          #   templates/
          #
          # パターンB:
          #   yt-music-dl/
          #     main.py
          #     requirements.txt
          #     templates/
          #
          # どちらにも対応
          # --------------------------------------------------------

          APP_ROOT="$EXTRACT_DIR"

          mapfile -t ROOT_ITEMS < <(
            find "$EXTRACT_DIR" \
              -mindepth 1 \
              -maxdepth 1 \
              -printf "%y\t%p\n" \
              | sort
          )

          if [ "${#ROOT_ITEMS[@]}" -eq 1 ]; then
            ITEM_TYPE="${ROOT_ITEMS[0]%%$'\t'*}"
            ITEM_PATH="${ROOT_ITEMS[0]#*$'\t'}"

            if [ "$ITEM_TYPE" = "d" ]; then
              APP_ROOT="$ITEM_PATH"

              echo ""
              echo "ZIP has one parent directory."
              echo "Application root:"
              echo "$APP_ROOT"
            fi
          fi

          if [ ! -d "$APP_ROOT" ]; then
            echo "ERROR: Application root does not exist."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "Application root contents"
          echo "========================================"

          find "$APP_ROOT" \
            -maxdepth 5 \
            -print \
            | sort

          # 必須ファイルを先に確認
          echo ""
          echo "Checking required files..."

          test -f "$APP_ROOT/main.py"
          test -f "$APP_ROOT/requirements.txt"
          test -f "$APP_ROOT/templates/index.html"
          test -f "$APP_ROOT/static/main.js"
          test -f "$APP_ROOT/static/style.css"

          echo "All required files found."

          echo "app_root=$APP_ROOT" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 4. Python構文チェック
      # ------------------------------------------------------------
      - name: Validate Python
        env:
          APP_ROOT: ${{ steps.root.outputs.app_root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Python syntax..."

          python3 -m py_compile "$APP_ROOT/main.py"

          echo "Python syntax: OK"

      # ------------------------------------------------------------
      # 5. ZIPを除いて既存アプリを完全削除
      #
      # .git
      # .github
      # .gitignore
      # .gitattributes
      #
      # は保持する。
      # ------------------------------------------------------------
      - name: Remove old application
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing old application..."

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name ".gitignore" \
            ! -name ".gitattributes" \
            -exec rm -rf {} +

          echo "Old application removed."

      # ------------------------------------------------------------
      # 6. 新しいアプリをコピー
      #
      # 展開場所は /tmp なので、
      # 5の削除処理で消えることは絶対にない。
      # ------------------------------------------------------------
      - name: Install new application
        env:
          APP_ROOT: ${{ steps.root.outputs.app_root }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing application from:"
          echo "$APP_ROOT"

          if [ ! -d "$APP_ROOT" ]; then
            echo "ERROR: Application root disappeared."
            echo "Expected:"
            echo "$APP_ROOT"
            exit 1
          fi

          cp -a "$APP_ROOT"/. .

          echo ""
          echo "Application installed successfully."

      # ------------------------------------------------------------
      # 7. ZIPと一時ファイルを削除
      # ------------------------------------------------------------
      - name: Clean temporary files
        env:
          ZIP_FILE: ${{ steps.zip.outputs.zip_file }}
          EXTRACT_DIR: ${{ steps.extract.outputs.extract_dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Cleaning temporary files..."

          rm -rf "$EXTRACT_DIR"

          if [ -f "$ZIP_FILE" ]; then
            rm -f "$ZIP_FILE"
          fi

          # 残っているZIPもすべて削除
          find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            -not -path "./.github/*" \
            -delete

          echo "Temporary files cleaned."

      # ------------------------------------------------------------
      # 8. 最終チェック
      # ------------------------------------------------------------
      - name: Verify final application
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Final application"
          echo "========================================"

          find . \
            -maxdepth 5 \
            -not -path "./.git/*" \
            -print \
            | sort

          echo ""
          echo "Checking required files..."

          test -f "main.py"
          test -f "requirements.txt"
          test -f "templates/index.html"
          test -f "static/main.js"
          test -f "static/style.css"

          echo "Required files: OK"

          echo ""
          echo "Checking Python syntax..."

          python3 -m py_compile main.py

          echo "Python syntax: OK"

          echo ""
          echo "========================================"
          echo "FINAL VERIFICATION PASSED"
          echo "========================================"

      # ------------------------------------------------------------
      # 9. Gitへコミット
      # ------------------------------------------------------------
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update application from uploaded ZIP"

          echo "Commit created."

      # ------------------------------------------------------------
      # 10. GitHubへPush
      # ------------------------------------------------------------
      - name: Push changes
        shell: bash
        run: |
          set -euo pipefail

          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo ""
          echo "========================================"
          echo "PUSH SUCCESSFUL"
          echo "========================================"
