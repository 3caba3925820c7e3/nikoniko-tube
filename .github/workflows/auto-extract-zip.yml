name: Auto Extract Zip (keep yml only)

# zipファイルがpushされたら自動発火
on:
  push:
    paths:
      - '**/*.zip'

permissions:
  contents: write

jobs:
  extract-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract zip files, keep only yml/yaml, remove zip
        run: |
          set -eu

          if ! command -v unzip &> /dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y unzip
          fi

          found_any=false

          # リポジトリ内にある全ての .zip を探索(.gitディレクトリは除外)
          while IFS= read -r -d '' zipfile; do
            found_any=true
            echo "======================================"
            echo "Processing: $zipfile"
            echo "======================================"

            # zipの中身を事前にリストしてログに残す(デバッグ用)
            echo "--- zip contents ---"
            unzip -l "$zipfile" || echo "!! unzip -l failed for $zipfile"

            dir=$(dirname "$zipfile")
            base=$(basename "$zipfile" .zip)
            dest_dir="$dir/$base"
            tmp_dir=$(mktemp -d)

            # 一旦テンポラリディレクトリに展開する(本番ディレクトリを直接汚さない)
            if ! unzip -o "$zipfile" -d "$tmp_dir"; then
              echo "!! ERROR: unzip failed for $zipfile"
              rm -rf "$tmp_dir"
              continue
            fi

            echo "--- extracted file count (all) ---"
            find "$tmp_dir" -type f | wc -l

            mkdir -p "$dest_dir"

            # yml/yaml ファイルだけを、ディレクトリ構造を保ったまま dest_dir にコピー
            yml_count=0
            while IFS= read -r -d '' ymlfile; do
              rel_path="${ymlfile#"$tmp_dir"/}"
              mkdir -p "$dest_dir/$(dirname "$rel_path")"
              cp "$ymlfile" "$dest_dir/$rel_path"
              yml_count=$((yml_count + 1))
            done < <(find "$tmp_dir" -type f \( -iname "*.yml" -o -iname "*.yaml" \) -print0)

            echo "--- copied yml/yaml file count: $yml_count ---"

            if [ "$yml_count" -eq 0 ]; then
              echo "!! WARNING: $zipfile に yml/yaml ファイルが1つも見つかりませんでした"
            fi

            rm -rf "$tmp_dir"
            rm -f "$zipfile"

            echo "=== Done: $dest_dir ==="
          done < <(find . -type f -iname "*.zip" -not -path "./.git/*" -print0)

          if [ "$found_any" = false ]; then
            echo "対象のzipファイルが見つかりませんでした。"
          fi

      - name: Show final state (debug)
        run: |
          echo "--- git status ---"
          git status
          echo "--- tracked yml/yaml files after extraction ---"
          find . -type f \( -iname "*.yml" -o -iname "*.yaml" \) -not -path "./.git/*"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-extract zip, keep yml only, remove zip [skip ci]"
            git push
          fi
