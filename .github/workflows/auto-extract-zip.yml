name: Sync Repository with Uploaded Zip

# zipファイルがpushされたら自動発火
on:
  push:
    paths:
      - '**/*.zip'

permissions:
  contents: write

jobs:
  sync-with-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace repo contents with zip contents
        run: |
          set -eu

          if ! command -v unzip &> /dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y unzip
          fi

          # 保護するファイル(このワークフロー自身)
          PROTECTED_FILE=".github/workflows/auto-extract-zip.yml"

          # リポジトリ内の全zipファイルを探す(.gitは除外)
          zip_files=$(find . -type f -iname "*.zip" -not -path "./.git/*" || true)

          if [ -z "$zip_files" ]; then
            echo "対象のzipファイルが見つかりませんでした。処理をスキップします。"
            exit 0
          fi

          echo "--- 見つかったzip ---"
          echo "$zip_files"

          # ワークフロー自身を退避(消えないようにバックアップ)
          backup_dir=$(mktemp -d)
          if [ -f "$PROTECTED_FILE" ]; then
            mkdir -p "$backup_dir/$(dirname "$PROTECTED_FILE")"
            cp "$PROTECTED_FILE" "$backup_dir/$PROTECTED_FILE"
            echo "保護ファイルを退避しました: $PROTECTED_FILE"
          fi

          # 一旦テンポラリディレクトリに全zipを展開(複数あれば全部マージ)
          tmp_dir=$(mktemp -d)
          echo "$zip_files" | while IFS= read -r zipfile; do
            echo "=== Extracting: $zipfile ==="
            unzip -l "$zipfile" || echo "!! unzip -l failed for $zipfile"
            unzip -o "$zipfile" -d "$tmp_dir"
          done

          echo "--- zipから展開された内容(リポジトリに反映されるファイル) ---"
          find "$tmp_dir" -type f

          # .git 以外のリポジトリ内の既存ファイル/フォルダを全削除
          echo "--- 既存ファイルを削除中 ---"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # zipの中身をリポジトリ直下にコピー(zip自体はここで含まれないので自動的に消える)
          cp -a "$tmp_dir"/. .

          # 保護ファイルを復元
          if [ -f "$backup_dir/$PROTECTED_FILE" ]; then
            mkdir -p "$(dirname "$PROTECTED_FILE")"
            cp "$backup_dir/$PROTECTED_FILE" "$PROTECTED_FILE"
            echo "保護ファイルを復元しました: $PROTECTED_FILE"
          fi

          rm -rf "$tmp_dir" "$backup_dir"

      - name: Show final state (debug)
        run: |
          echo "--- git status ---"
          git status
          echo "--- 現在のファイル一覧(.git除く) ---"
          find . -not -path "./.git*" -maxdepth 2

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync repository with uploaded zip contents [skip ci]"
            git push
          fi
