<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NicoStream</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#f4f6fb;font-family:system-ui,sans-serif}
.wrap{max-width:1050px;margin:auto;padding:42px 20px}.hero{text-align:center;margin-bottom:32px}
h1{font-size:42px;margin:0 0 8px}.sub,.meta,#status{color:#9ba3b5}
.search{display:flex;gap:10px;max-width:760px;margin:25px auto}
input{flex:1;background:#171b24;border:1px solid #303746;color:white;padding:15px;border-radius:12px;font-size:16px}
button{border:0;border-radius:12px;padding:0 22px;background:#fff;color:#111;font-weight:700;cursor:pointer}
#status{text-align:center;min-height:24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;margin-top:20px}
.card{background:#131720;border:1px solid #252b37;border-radius:15px;overflow:hidden;cursor:pointer}.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#202532}
.body{padding:14px}.title{font-weight:700;line-height:1.4}.meta{font-size:13px;margin-top:7px}
.player{display:none;margin:30px auto;max-width:900px}.player video{width:100%;max-height:70vh;background:#000;border-radius:14px}
.player h2{font-size:20px}.back{height:38px;background:none;border:1px solid #343b49;color:#ddd}
@media(max-width:650px){h1{font-size:32px}.search{flex-direction:column}.search button{height:48px}}
</style></head><body><div class="wrap">
<section class="hero"><h1>NicoStream</h1><div class="sub">ニコニコ動画を検索して、そのまま再生</div>
<form class="search" id="form"><input id="q" placeholder="動画を検索..." autocomplete="off"><button>検索</button></form></section>
<section class="player" id="player"><button class="back" onclick="closePlayer()">← 検索結果へ</button><h2 id="playerTitle"></h2><video id="video" controls playsinline></video></section>
<div id="status"></div><div class="grid" id="results"></div></div>
<script>
const form=q=document.getElementById('form'), input=document.getElementById('q'), results=document.getElementById('results'), status=document.getElementById('status'), player=document.getElementById('player'), video=document.getElementById('video'), playerTitle=document.getElementById('playerTitle');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(s){if(!s)return'';s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
form.addEventListener('submit',async e=>{e.preventDefault();let term=input.value.trim();if(!term)return;status.textContent='検索中...';results.innerHTML='';closePlayer(true);
try{let r=await fetch('/api/search?q='+encodeURIComponent(term)),d=await r.json();if(!r.ok)throw Error(d.detail);status.textContent=d.results.length+'件';
results.innerHTML=d.results.map((x,i)=>'<article class="card"><img class="thumb" src="'+esc(x.thumbnail||'')+'" loading="lazy"><div class="body"><div class="title">'+esc(x.title)+'</div><div class="meta">'+esc(x.uploader||'')+(x.duration?' ・ '+fmt(x.duration):'')+'</div></div></article>').join('');
[...results.children].forEach((el,i)=>el.onclick=()=>play(d.results[i]));}catch(e){status.textContent='エラー: '+e.message;}});
let hls=null;
function teardownHls(){if(hls){hls.destroy();hls=null;}}
async function play(item){status.textContent='ストリームを準備中...';try{let r=await fetch('/api/info?url='+encodeURIComponent(item.url)),d=await r.json();if(!r.ok)throw Error(d.detail);
let fs=(d.formats||[]).filter(x=>x.url),f=fs.filter(x=>x.vcodec!=='none'&&x.acodec!=='none').sort((a,b)=>(b.height||0)-(a.height||0))[0]||fs.find(x=>x.vcodec!=='none');if(!f)throw Error('再生可能な形式が見つかりません');
playerTitle.textContent=d.title||item.title;player.style.display='block';window.scrollTo({top:0,behavior:'smooth'});status.textContent='';
teardownHls();video.removeAttribute('src');video.load();
let streamUrl='/api/stream?url='+encodeURIComponent(f.url);
let isHls=(f.protocol||'').includes('m3u8')||f.url.split('?')[0].endsWith('.m3u8');
if(isHls&&window.Hls&&Hls.isSupported()){
  hls=new Hls();hls.loadSource(streamUrl);hls.attachMedia(video);
  hls.on(Hls.Events.ERROR,(_,data)=>{if(data.fatal)status.textContent='エラー: 再生に失敗しました ('+data.details+')';});
}else{
  video.src=streamUrl;
}
video.play().catch(()=>{});}catch(e){status.textContent='エラー: '+e.message;}}
function closePlayer(silent=false){teardownHls();video.pause();video.removeAttribute('src');video.load();player.style.display='none';if(!silent)status.textContent='';}
</script></body></html>
